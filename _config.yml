# main text of home
title: Adm Chrysler
bio: Infrastructure and platform engineer. Linux, virtualization, self-hosted platforms.

# twitter summary info
description: Personal site of Adm Chrysler, infrastructure and platform engineer in Upstate New York.

# if it's an external image, update below for true
# better with square images
external-image: false
picture: assets/images/adm_art_c.jpg

# If you want to include your resume, set to true
# and specify source (external or local).
resume: true
resume-external: false
resume-url: resume

url: https://admchrysler.com
# your url: https://USERNAME.github.io

permalink: /:title/
build: /
repository: admish/admchrysler

# To enable google analytics, supply your GA4 measurement ID below
analytics-google: 'G-LJ12FNMHXM'

# if you don't want comments in your posts, leave categories empty
# disqus:
#   shortname: mydisqus # enter this from your disqus account
#   categories: [blog, project] # only show disqus for posts that have these categories

# if you don't have any of social below, comment the line
# facebook: adium
# twitter: admish
# instagram: admish
# pinterest: mypinterest
linkedin: adium
# youtube: adium
# spotify: myspotify
github: admish
# gitlab: mygitlab
# lastfm: mylastfm
stackoverflow: 2589674/admish
# quora: userquora
# reddit: adium
# medium: medium
# vimeo: myvimeo
codepen: admish
# lanyrd: mylanyrd
email: ''  # intentionally blank; contact via /contact/ form

authors:
    admchrysler:
        name: Adm Chrysler
        bio: Infrastructure and platform engineer
        external-image: false
        picture: assets/images/logo.jpg
        twitter: admish

# do you want a larger site? change the option below
# options: [normal, large] | default: normal
# normal = 560px / large = 810px
width: normal

# if you do/don't need pagination, toggle 'enabled' between true/false below
#pagination:
#  enabled: false
#  sort_reverse: true # display recent posts first
#  title: ":title" # Changing this will mess up the header display logic
#  per_page: 5
#  permalink: "/:num/" # pagination link that will be appended

# if you don't need projects, comment the *projects* configs below
projects: true

# if you don't need "about" or "blog", comment them out below
about: true
contact: true
blog: true

# do you want to show the "read time" of the posts?
read-time: true

# do you want to show the "tags" inside the posts?
show-tags: true

# related posts inside a post?
related: true

# Display links for next and previous posts for the specified categories
post-advance-links: [blog]

# show author block at the end of a post ?
show-author: true

# do you want some animations?
animation: true

# add default values to specific pages or layouts
defaults:
  - scope:
      path: "" # an empty string here means all files in the project
      layout: "post"
    values:
      # setting all post to not hidden by default,
      # can be overridden in the front matter for a specific post
      hidden: false

plugins:
  - jekyll-seo-tag
  - jekyll-gist
  - jekyll-feed
  - jemoji
  #- jekyll-admin
  #- jekyll-paginate-v2

jekyll-mentions:
  base_url: https://admchrysler.com

compress_html:
  ignore:
    envs:
      - development
      - stage

# Keep repo scaffolding out of the published site. Anything not listed here
# gets copied to _site verbatim and served publicly.
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - README-orig.md
  - FAQ.md
  - Rakefile
  - entrypoint.sh
  - script/
  - node_modules/
  - vendor/
